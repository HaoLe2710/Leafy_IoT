; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32cam

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = 
	-std=gnu++17
	-D LEAFY_FIRMWARE_VERSION=\"leafy-esp32-0.1.0\"
	-D LEAFY_DEFAULT_DEVICE_UID=\"leafy-prototype-001\"
	-D LEAFY_DEFAULT_DEVICE_CODE=\"LEAFY-PROTO-001\"
	; Production MQTT broker on Fly.io. Use the IP directly because ESP32 DNS lookup can fail on some networks.
	-D LEAFY_DEFAULT_MQTT_HOST=\"137.66.4.201\"
	-D LEAFY_DEFAULT_MQTT_PORT=1883
	-D LEAFY_DEFAULT_MQTT_USERNAME=\"admin\"
	-D LEAFY_DEFAULT_MQTT_PASSWORD=\"admin\"
	-D LEAFY_DEFAULT_WIFI_SSID=\"\"
	-D LEAFY_DEFAULT_WIFI_PASSWORD=\"\"
	; ESP32-CAM sensor wiring: keep GPIO34/GPIO35/GPIO26 reserved for the AI-Thinker camera.
	-D LEAFY_DHT_PIN=13
	; Schematic routes ADS1115 SDA to IO15 and SCL to IO14.
	-D LEAFY_I2C_SDA_PIN=15
	-D LEAFY_I2C_SCL_PIN=14
	-D LEAFY_USE_ADS1115=1
	-D LEAFY_SOIL_ADS_CHANNEL=1
	-D LEAFY_LDR_ADS_CHANNEL=0
	-D LEAFY_SOIL_ADC_PIN=-1
	-D LEAFY_SOIL_POWER_PIN=-1
	-D LEAFY_LDR_ADC_PIN=-1
	-D LEAFY_ANALOG_MAX=4095
	-D LEAFY_SOIL_DRY_RAW=3200
	-D LEAFY_SOIL_WET_RAW=1200
	-D LEAFY_LIGHT_DARK_RAW=3500
	-D LEAFY_LIGHT_BRIGHT_RAW=500
	-D LEAFY_CALIBRATION_LOGGING=0
	-D LEAFY_CALIBRATION_LOG_INTERVAL_SEC=30
	; Runtime reset button: wire GPIO2 to GND through a normally-open button.
	-D LEAFY_RUNTIME_RESET_BUTTON_PIN=2
	-D LEAFY_RUNTIME_RESET_HOLD_MS=5000
	-D LEAFY_RUNTIME_RESET_DEBOUNCE_MS=50
lib_deps = 
	bblanchon/ArduinoJson@^7.0.0
	knolleary/PubSubClient@^2.8
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit ADS1X15@^2.5.0

[env:esp32dev]
board = esp32dev
lib_deps = 
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/DHT sensor library@^1.4.7
	espressif/esp32-camera@^2.0.4
	bblanchon/ArduinoJson@^7.2.2
	knolleary/PubSubClient@^2.8
	tzapu/WiFiManager@^2.0.17
	adafruit/Adafruit ADS1X15@^2.5.0

[env:esp32cam]
board = esp32cam
build_flags = 
	${env.build_flags}
	-D LEAFY_ESP32_CAM=1
lib_deps = 
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/DHT sensor library@^1.4.7
	espressif/esp32-camera@^2.0.4
	bblanchon/ArduinoJson@^7.2.2
	knolleary/PubSubClient@^2.8
	tzapu/WiFiManager@^2.0.17
	adafruit/Adafruit ADS1X15@^2.5.0

[env:esp32cam_storage_test]
board = esp32cam
build_flags = 
	${env.build_flags}
test_build_src = yes
build_src_filter = 
	-<*>
	+<app/config_store.cpp>
	+<utils/logger.cpp>
lib_deps =

[env:esp32cam_upload_endpoint_test]
board = esp32cam
build_flags =
	${env.build_flags}
	-D LEAFY_ESP32_CAM=1
test_build_src = yes
build_src_filter =
	-<*>
	+<app/file_upload_service.cpp>
	+<models/image_meta_payload.cpp>
	+<utils/logger.cpp>
lib_deps =
	bblanchon/ArduinoJson@^7.2.2
